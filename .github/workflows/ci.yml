name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev,office]"

      - name: Git identity for tests
        run: |
          git config --global user.name "coara-ci"
          git config --global user.email "ci@localhost"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check . || true

      - name: Pytest (default tier)
        run: pytest tests/ -q --timeout 120 -x

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Web build
        working-directory: src/ui/web
        run: |
          npm ci
          npm run build
