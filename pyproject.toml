[project]
name = "coara"
version = "1.0.20"
description = "An AI assistant runtime that can create and organize sub-agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "coara Team"}
]

dependencies = [
    # LLM Providers
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    
    # Core Utilities
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "click>=8.1.0",
    "prompt_toolkit>=3.0.0",
    "questionary>=2.0.0",

    # Text Processing
    "pygments>=2.18.0",
    "python-frontmatter>=1.1.0",
    "trafilatura>=2.0.0",
    
    # File Watching
    "watchdog>=5.0.0",

    # Text encoding detection for legacy (non-UTF-8) files
    "charset-normalizer>=3.0",
    
    # HTTP & Networking
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "matrix-nio>=0.25.2",
    
    # Process Management
    "psutil>=6.0.0",
    
    # Async Database
    "aiosqlite>=0.19.0",

    # Encryption (vault)
    "cryptography>=43.0.0",
    
    # Scheduling
    "croniter>=2.0.0",
    
    # Logging
    "loguru>=0.7.0",

    # 系统托盘 launcher（coara tray 桌面入口）：托盘图标 + 右键菜单。小且纯 Python，
    # 随发布包（coara[office]）一起装——桌面图标/托盘是终端用户的桌面体验核心。
    "pystray>=0.19.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
# WDL 独立软件（仓库顶层兄弟子项目 wdl/，自带 CLI 与独立发布）。
#
# coara 的**内嵌 flow 能力不需要它**：图内核（model/semantics/serde）已自持于
# src/workflow/core/，见该目录 __init__.py 的分叉声明。此 extra 只在以下场景需要：
#   - 跑漂移哨兵 tests/test_workflow/test_core_fork_parity.py（拿 wdl 当 oracle）
#   - 与 wdl-engine 做互操作（同一份 WDL 文件被两边消费）
wdl = [
    "wdl-engine",
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "ruff==0.15.12",
    "mypy>=1.13.0",
    "pillow>=10.0.0",
    "qrcode[pil]>=7.4.2",
]
office = [
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pymupdf>=1.24.0",
]
desktop = [
    # 内置挂起工具（截图/图片压缩）：screenshot
    "mss>=10.0.0",
    "pillow>=10.0.0",
    # 内置挂起工具（邮件）：email
    "imap-tools>=1.0.0",
    # 打印 PDF 按页提取（printer action=print 的 pages 参数）
    "pypdf>=5.0.0",
]

[project.scripts]
coara = "src.cli.main:cli"
# 开发者 debug 工具（LLM log 查看器）：源码环境可用，发布 wheel 不含 src.devtools
coara-devtools = "src.devtools.server:main"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["src.ui.web", "src.ui.web.*", "src.devtools", "src.devtools.*"]

# Non-.py runtime assets (wheel otherwise ships Python only — breaks Web UI + subagents).
# Paths are relative to each package directory. Do NOT include src/ui/web (Vite source / node_modules).
[tool.setuptools.package-data]
"src.coara" = ["prompts/**/*.md", "prompts/**/*.yaml"]
"src.cli" = ["coara.ico"]
"src.records" = ["loading_phrases.json"]
"src.ui" = ["static/**/*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120
# wdl/ 是独立子项目（自带 pyproject 与 ruff 配置），不卷入主项目 lint
exclude = ["wdl"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Files embedding LLM prompt templates as triple-quoted strings;
# long prompt lines are intrinsic and should not be force-wrapped.
"src/tools/builtin/delegate/delegate.py" = ["E501"]
"src/tools/builtin/scheduling/reminder.py" = ["E501"]
"src/tools/builtin/file_io/write.py" = ["E501"]
"src/tools/builtin/integration/tool.py" = ["E501"]
"src/tools/builtin/runtime/shell.py" = ["E501"]
"src/tools/builtin/code_mode/ptc.py" = ["E501"]
# Standalone dev/utility scripts: sys.path manipulation before imports (E402)
# and long Chinese text in output templates (E501).
"scripts/dev/*.py" = ["E402", "E501"]
"scripts/soft-copyright/*.py" = ["E501"]
"skills/agnes/scripts/agnes_api.py" = ["E402"]

[tool.mypy]
# 类型检查为「尽力而为」档：不启用 strict，目标是建立可复现、可对比的基线。
# 默认配置等价于此前手工执行的 `mypy src --ignore-missing-imports`。
ignore_missing_imports = true
# wdl/ 是独立子项目（自带 pyproject 与工具链），不卷入主项目类型检查。
exclude = ["^wdl/"]
# 不因「未被使用的 type: ignore」报错：POSIX 专有符号（os.getpgid / fcntl.flock）
# 在 Windows 与 Linux 上是否报错不同，同一行忽略在另一侧必然「未使用」。
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Keep the default loop on function scope (pytest-asyncio 1.x default is unset/None).
asyncio_default_fixture_loop_scope = "function"
# Default: core smoke (~280 tests). Extended detail: pytest -m extended. Full: pytest -m "".
addopts = "-m 'not real_env and not e2e and not extended'"
# Hard ceiling per test so a stuck test fails fast instead of hanging the run
# forever (orphan pytest processes previously outlived killed shells).
# thread method works on Windows; signal-based kill is POSIX-only.
timeout = 120
timeout_method = "thread"
markers = [
    "e2e: end-to-end tests that exercise multi-component runtime flows",
    "real_env: tests or scripts that depend on real providers, network, or current workspace",
    "extended: detailed edge-case and integration tests (excluded from default pytest run)",
]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
