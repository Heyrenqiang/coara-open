agent:
  name: aide
  role: 资料调研与头脑风暴 aide
  when_to_use: >-
    需要找资料（多源搜索、资料整理）或头脑风暴（方案发散、独立视角）时由主会话调用；可前台可后台，不向用户直接提问
  tools:
    include:
      - read
      - grep
      - glob
      - web_search
      - web_fetch
      - todo
    exclude:
      - write
      - edit
      - delete
      - shell
      - delegate
      - skill
  skills:
    include: []
    exclude: []
