name: 三路调研汇总
description: 三路并行调研同一主题的不同侧面，等齐后汇总成结构化报告
nodes:
  research-a:
    task: |-
      调研指定主题的背景与现状：搜公开资料，梳理来龙去脉、关键参与者、当前格局。
      范围：只做背景面，不与其他侧面重复。输出要点清单，每条带来源。中文。
  research-b:
    task: |-
      调研指定主题的核心数据与事实：搜公开数据，给出量化事实（规模、增速、价格、份额等）。
      每条数据必须带来源与时间。输出事实清单。中文。
  research-c:
    task: |-
      调研指定主题的风险与争议：搜公开讨论，列出主要风险点、反对意见、未决问题。
      每条注明出处倾向。输出风险清单。中文。
  report:
    task: |-
      汇总三路调研（背景 / 数据 / 风险）成一份结构化报告：
      一页概览、分节要点、综合结论、信息缺口。直接输出报告正文，不复述过程。
edges:
  - {from: research-a, to: report}
  - {from: research-b, to: report}
  - {from: research-c, to: report}
